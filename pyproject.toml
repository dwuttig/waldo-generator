[project]
name = "scenegen"
version = "0.1.0"
description = "Turn family photos into cartoon characters and hide them in large crowded hidden-object scenes"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pillow>=10.1",
  "pillow-heif>=0.18",
  "numpy>=1.26",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scenegen = "scenegen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scenegen*"]

[tool.setuptools.package-data]
scenegen = ["static/*", "workflows/*.json"]
