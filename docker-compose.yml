services:
  scenegen:
    build: .
    image: hidden-family:latest
    restart: unless-stopped
    ports:
      # Only reachable from this computer. To open it to your home network,
      # change to "8000:8000" and set SCENEGEN_PASSWORD in .env.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - scenegen-data:/data
    # For a local ComfyUI on the host, set its URL in Settings to
    # http://host.docker.internal:8188
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  scenegen-data:
